[package]
name = "tetrafree"
version = "3.5.0"
description = "TetraFree — совместная разработка с ИИ-агентами"
edition = "2021"
rust-version = "1.90"

[lib]
name = "tetrafree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-notification = { version = "2", optional = true }

# Системные функции Windows (автозапуск, трей, глобальная клавиша). Включение: npm run desktop:build:extras
[features]
default = []
extras = ["dep:tauri-plugin-autostart", "dep:tauri-plugin-global-shortcut", "dep:tauri-plugin-notification"]
# Автообновление через GitHub Releases (нужен ключ подписи, см. .github/workflows/release.yml)
updater = ["dep:tauri-plugin-updater"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
