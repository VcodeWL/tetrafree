<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070709" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>TetraFree — совместная разработка с ИИ-агентами</title>
  </head>
  <body>
    <div id="root"><div class="splash" aria-label="Загрузка"><img src="/logo.png" width="44" height="44" alt="" /><i></i></div></div>
    <style>
      html,body{background:#070709;margin:0}
      .splash{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:18px;background:#070709}
      .splash img{border-radius:12px;animation:sp-b 1.6s ease-in-out infinite}
      .splash i{width:120px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#b78fff,transparent);background-size:200% 100%;animation:sp-s 1.1s linear infinite}
      @keyframes sp-b{50%{transform:scale(1.06);opacity:.8}}@keyframes sp-s{from{background-position:200% 0}to{background-position:-200% 0}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
